; =============================================================================
; config.example.ini  —  template, safe to commit
;
; Copy this file to config.ini and fill in the values for YOUR machine.
; config.ini is listed in .gitignore and will never be committed.
;
; Why two files: the structure of the config is part of the project and a
; stranger cloning the repo needs to know what settings exist. The VALUES are
; specific to one machine and, in some setups, secret. Splitting them is the
; standard way to share the shape of a config without sharing its contents.
; =============================================================================

[sqlserver]

; The instance name. Find it in SSMS: the "Server name" box in the Connect
; dialog, or run  SELECT @@SERVERNAME;  in a query window.
; Developer Edition default instance is usually just the machine name or
; "localhost". A named instance looks like  localhost\SQLEXPRESS
server = localhost

; Created in Phase 4. It does not exist yet — that is expected.
database = AgriFinance

; The ODBC driver installed on this machine. Check which one you have:
;   Windows > "ODBC Data Sources (64-bit)" > Drivers tab
; Common values: ODBC Driver 18 for SQL Server, ODBC Driver 17 for SQL Server
driver = ODBC Driver 17 for SQL Server

; "yes" uses your Windows login to authenticate — no password stored anywhere.
; This is the safer option and the reason there is no password field here.
; Set to "no" only if you are using a SQL Server login instead.
trusted_connection = yes

; Driver 18 encrypts by default and will refuse a local connection with a
; self-signed certificate unless this is yes. Driver 17 ignores it.
trust_server_certificate = yes
